---
# tasks file for roles/common
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - unzip
      - mysql-client
      - nodejs
      - npm
      - software-properties-common
    state: present
